[package]
name = "spotify-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
open = "5.3"
inquire = "0.7"
colored = "2.1"
comfy-table = "7.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
url = "2.5"
crossterm = "0.28"
unicode-width = "0.2"
