name: Build & Release CLI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Releases"
        type: boolean
        default: false
      release_tag:
        description: "Release tag name (e.g. v0.1.0 - required if publishing via manual dispatch)"
        type: string
        default: ""

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: spotify-cli.exe
            asset_name: spotify-cli-windows-x86_64.exe
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: spotify-cli
            asset_name: spotify-cli-linux-x86_64
          - name: macOS Apple Silicon (ARM64)
            os: macos-latest
            target: aarch64-apple-darwin
            bin_name: spotify-cli
            asset_name: spotify-cli-macos-arm64
          # Temporarily disabled macOS Intel (macos-13 queue wait time is very high)
          # - name: macOS Intel (x86_64)
          #   os: macos-13
          #   target: x86_64-apple-darwin
          #   bin_name: spotify-cli
          #   asset_name: spotify-cli-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/${{ matrix.asset_name }}
          chmod +x dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          generate_release_notes: true
